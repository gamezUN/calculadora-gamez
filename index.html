<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora básica</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eef2f7;
            font-family: Arial, sans-serif;
        }

        .calculadora {
            width: 300px;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000020;
        }

        h1 {
            text-align: center;
            color: #243653;
        }

        #pantalla {
            width: 100%;
            height: 55px;
            margin-bottom: 15px;
            padding: 5px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            text-align: right;
            font-size: 25px;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 8px;
            background-color: #e2e8f0;
            color: #243653;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #cbd5e1;
        }

        .operador, .limpiar, .igual {
            background-color: #4776d0;
            color: white;
        }

        .operador:hover, .limpiar:hover, .igual:hover {
            background-color: #3564bd;
        }
    </style>
</head>
<body>
    <div class="calculadora">
        <h1>Calculadora</h1>

        <input type="text" id="pantalla" value="0" readonly>

        <div class="botones">
            <button class="limpiar" onclick="limpiar()">C</button>
            <button class="operador" onclick="seleccionarOperacion('/')">/</button>
            <button class="operador" onclick="seleccionarOperacion('*')">x</button>
            <button class="operador" onclick="seleccionarOperacion('-')">-</button>

            <button onclick="agregarNumero('7')">7</button>
            <button onclick="agregarNumero('8')">8</button>
            <button onclick="agregarNumero('9')">9</button>
            <button class="operador" onclick="seleccionarOperacion('+')">+</button>

            <button onclick="agregarNumero('4')">4</button>
            <button onclick="agregarNumero('5')">5</button>
            <button onclick="agregarNumero('6')">6</button>
            <button class="igual" onclick="calcular()">=</button>

            <button onclick="agregarNumero('1')">1</button>
            <button onclick="agregarNumero('2')">2</button>
            <button onclick="agregarNumero('3')">3</button>
            <button onclick="agregarNumero('0')">0</button>
        </div>
    </div>

    <script>
        let pantalla = document.getElementById("pantalla");

        let numero1 = 0;
        let operador = "";

        function agregarNumero(numero) {
            if (pantalla.value === "0" || pantalla.value === "Error") {
                pantalla.value = numero;
            } else {
                pantalla.value = pantalla.value + numero;
            }
        }

        function seleccionarOperacion(signo) {
            numero1 = Number(pantalla.value);
            operador = signo;
            pantalla.value = "0";
        }

        function calcular() {
            let numero2 = Number(pantalla.value);
            let resultado = 0;

            if (operador === "+") {
                resultado = numero1 + numero2;
            } else if (operador === "-") {
                resultado = numero1 - numero2;
            } else if (operador === "*") {
                resultado = numero1 * numero2;
            } else if (operador === "/") {
                if (numero2 === 0) {
                    pantalla.value = "Error";
                    operador = "";
                    return;
                } else {
                    resultado = numero1 / numero2;
                }
            }

            pantalla.value = resultado;
            operador = "";
        }

        function limpiar() {
            pantalla.value = "0";
            numero1 = 0;
            operador = "";
        }
    </script>
</body>
</html>
